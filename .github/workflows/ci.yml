name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      db:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: tattara
          POSTGRES_PASSWORD: tattara
          POSTGRES_DB: tattara
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U tattara -d tattara"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      NUXT_DATABASE_URL: postgres://tattara:tattara@localhost:5432/tattara
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # version comes from package.json "packageManager"

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm db:migrate
      # Unit + integration with coverage gates (100% on server/utils/scope.ts), then the Nuxt-runtime tests.
      - run: pnpm test:coverage
      - run: pnpm test:nuxt
      - run: pnpm build
      # High/critical advisories in packages the server ships fail the build; dev-only ones are listed (ADR-050).
      - run: pnpm audit:runtime

  e2e:
    name: E2E (Playwright)
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # E2E recreates its own tattara_e2e database through this admin connection (test/e2e/global-setup.ts).
    services:
      db:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: tattara
          POSTGRES_PASSWORD: tattara
          POSTGRES_DB: tattara
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U tattara -d tattara"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      NUXT_DATABASE_URL: postgres://tattara:tattara@localhost:5432/tattara
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
