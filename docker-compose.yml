services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: tattara
      POSTGRES_PASSWORD: tattara
      POSTGRES_DB: tattara
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # TCP check: the image's init phase runs a temporary socket-only server that must not count as ready.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U tattara -d tattara"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  pgdata:
